name: Elsewhere checks
on:
  push:
    branches: [main, feature/elsewhere-14-living-atlas]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/elsewhere14.js
      - run: node --test tests/*.test.mjs
      - run: node tools/guard_reset14.mjs --check
      - run: node tools/verify_x5.mjs
      - run: node tools/rebuild14.mjs --check

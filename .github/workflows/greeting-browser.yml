name: Greeting browser acceptance
on:
  pull_request:
    paths:
      - 'src/elsewhere-greeting.js'
      - 'src/elsewhere-arrival.js'
      - 'src/elsewhere-arrival.css'
      - 'src/elsewhere-omni20.js'
      - 'tests/browser_greeting.py'
      - 'index.html'
      - 'tools/rebuild14.mjs'

permissions:
  contents: read

jobs:
  greeting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_greeting.py
      - run: python tests/browser_full_omni20.py
